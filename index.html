<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>A3 Quiz - IA vs Realidade</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #f1f5f9; text-align: center; margin: 0; padding: 20px; }
        .controls { margin: 20px 0; display: flex; justify-content: center; gap: 15px; }
        select { padding: 10px; font-size: 1em; border-radius: 5px; background: #1e293b; color: white; border: 1px solid #475569; cursor: pointer; }
        .matchup { display: flex; justify-content: center; gap: 30px; margin-top: 30px; }
        .box { width: 45%; border: 3px solid #334155; padding: 20px; border-radius: 15px; cursor: pointer; background: #1e293b; transition: all 0.2s ease; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 420px; }
        .box:hover { border-color: #deff9a; transform: scale(1.01); }

        /* Renderização das Mídias */
        video, img { width: 100%; height: 360px; object-fit: contain; background: #000; border-radius: 8px; }
        audio { width: 100%; margin: auto 0; }

        #feedback { margin-top: 30px; font-size: 1.6em; font-weight: bold; min-height: 40px; }
        button { padding: 12px 30px; font-size: 1.1em; cursor: pointer; background: #deff9a; border: none; border-radius: 5px; font-weight: bold; color: #0f172a; }
        button:hover { background: #bada6f; }
        .option-title { font-size: 1.3em; font-weight: bold; margin-top: 15px; color: #94a3b8; }
    </style>
</head>
<body>

<h1>A3 QUIZ - Inteligência Artificial vs Realidade</h1>
<p>Escolha o tipo de jogo, analise as mídias e clique na caixa que você jura que é <strong>IA</strong>!</p>

<div class="controls">
    <label style="font-size: 1.2em; align-self: center;">Tipo de Mídia:</label>
    <select id="media-type-selector" onchange="loadRound()">
        <option value="VIDEO">🎬 Vídeos (Deepfakes)</option>
        <option value="AUDIO">🎵 Áudios (Clonagem de Voz)</option>
        <option value="IMAGE">📸 Imagens (Geradas por IA)</option>
    </select>
</div>

<div id="game-area">
    <div class="matchup">
        <div class="box" onclick="check('A')">
            <div id="slot-a" style="width: 100%;"></div>
            <div class="option-title">Opção A</div>
        </div>
        <div class="box" onclick="check('B')">
            <div id="slot-b" style="width: 100%;"></div>
            <div class="option-title">Opção B</div>
        </div>
    </div>
    <p id="feedback"></p>
    <button onclick="loadRound()">Próximo Duelo</button>
</div>

<script>
    let correctLetter = "";
    const BACKEND_URL = "http://localhost:8080";

    async function loadRound() {
        document.getElementById('feedback').innerText = "";

        // Pega o tipo selecionado no menu (VIDEO, AUDIO ou IMAGE)
        const selectedType = document.getElementById('media-type-selector').value;

        try {
            // Passa o tipo dinamicamente na URL do seu backend
            const response = await fetch(`${BACKEND_URL}/api/quiz/versus?type=${selectedType}&rounds=1`);

            if (response.status === 204) {
                document.getElementById('slot-a').innerHTML = "❓";
                document.getElementById('slot-b').innerHTML = "❓";
                document.getElementById('feedback').innerText = `⚠️ Mídias insuficientes para o tipo ${selectedType} no banco de dados.`;
                document.getElementById('feedback').style.color = "#f59e0b";
                return;
            }

            const data = await response.json();

            if (data.length > 0) {
                const round = data[0];
                correctLetter = round.correctAnswer; // Guarda se a resposta certa é 'A' ou 'B'

                renderMedia('slot-a', round.mediaA);
                renderMedia('slot-b', round.mediaB);
            }
        } catch (error) {
            console.error("Erro na requisição:", error);
            document.getElementById('feedback').innerText = "❌ Falha ao conectar com o servidor local do Spring Boot.";
            document.getElementById('feedback').style.color = "#ef4444";
        }
    }

    function renderMedia(containerId, media) {
        const container = document.getElementById(containerId);
        container.innerHTML = "";

        // Como usamos Discord/Imgur, a URL já começa com "http", então usamos ela de forma direta e global
        const url = media.fileUrl;

        // Chaveamento dinâmico baseado na propriedade vinda do banco de dados
        if (media.mediaType === 'VIDEO') {
            container.innerHTML = `<video src="${url}" controls preload="auto"></video>`;
            container.querySelector('video').load();
        } else if (media.mediaType === 'IMAGE') {
            container.innerHTML = `<img src="${url}" alt="Mídia do Quiz">`;
        } else if (media.mediaType === 'AUDIO') {
            container.innerHTML = `<audio src="${url}" controls preload="auto"></audio>`;
            container.querySelector('audio').load();
        }
    }

    function check(chosen) {
        const feedback = document.getElementById('feedback');
        if (feedback.innerText !== "") return; // Evita cliques múltiplos na mesma rodada

        if (chosen === correctLetter) {
            feedback.innerText = "🎉 VOCÊ ACERTOU! Esta opção foi de fato gerada por IA.";
            feedback.style.color = "#4ade80";
        } else {
            feedback.innerText = "❌ VOCÊ ERROU! Esta é a mídia real e legítima.";
            feedback.style.color = "#f87171";
        }
    }

    // Carrega o primeiro duelo automaticamente assim que abre a página
    loadRound();
</script>
</body>
</html>
