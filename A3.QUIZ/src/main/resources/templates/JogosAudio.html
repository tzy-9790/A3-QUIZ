<!DOCTYPE HTML>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA / PERCEPÇÃO - JOGO (ÁUDIO)</title>
    <!-- Link para o CSS dedicado de áudio -->
    <link rel="stylesheet" href="../static/css/jogo-audio.css">
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic+Coding:wght@400;700&family=Mirza&display=swap" rel="stylesheet">
</head>
<body>

<div class="page-jogos">
    <!-- Imagem de fundo -->
    <img class="background-overlay" src="/imagens/fundoModos.png" alt="Background Overlay"/>

    <nav class="top-nav">
        <div class="logo">IA / PERCEPÇÃO</div>
        <div class="nav-buttons-container">
            <a href="/modos.html" class="nav-button">MUDAR MODO</a>
        </div>
    </nav>

    <div class="quote-banner">
        <p>A percepção auditiva é facilmente enganada. O que você ouve é real ou foi gerado por algoritmos?</p>
    </div>

    <h1 id="question-title" class="text-wrapper">Qual dos áudios foi gerado por IA?</h1>

    <div id="quiz-container" class="quiz-container">
        <!-- Card Opção A -->
        <div id="option-a" class="option-card" onclick="handleAnswer('A')">
            <div class="audio-placeholder">
                <div class="audio-icon">🎧</div>
                <audio controls src=""></audio>
            </div>
        </div>

        <!-- Card Opção B -->
        <div id="option-b" class="option-card" onclick="handleAnswer('B')">
            <div class="audio-placeholder">
                <div class="audio-icon">🎧</div>
                <audio controls src=""></audio>
            </div>
        </div>
    </div>
</div>

<!-- Script para evitar que clicar no "play" marque a resposta sem querer -->
<script>
    document.querySelectorAll('audio').forEach(el => {
        el.addEventListener('click', (e) => e.stopPropagation());
    });
</script>

<!-- <script src="/js/jogo-audio.js"></script> -->
</body>
</html>
